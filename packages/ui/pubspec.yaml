name: ui
description: "Package for themes, widgets, and UI components of the application."
version: 0.0.1

resolution: workspace

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.11.0

flutter:
  generate: true
  assets:
    - assets/images/

flutter_gen:
  output: lib/src/constant/
  line_length: 120